services:
  assetbook:
    build: .
    image: assetbook:latest
    container_name: assetbook
    restart: unless-stopped
    ports:
      # 左边是你机器上的端口，想换就改这里，比如 "9000:8000"
      - "8000:8000"
    environment:
      # 首次启动自动设置登录密码（之后改密码在界面「设置」里改）
      ASSETBOOK_PASSWORD: ${ASSETBOOK_PASSWORD:-}
      # 会话签名密钥；不填也会自动生成并存在数据库里。
      # 若填了固定值，请务必改成一串随机字符，且别提交到 git。
      ASSETBOOK_SECRET: ${ASSETBOOK_SECRET:-}
      # 可选：接入 OpenAI 兼容接口做「AI 智能分类」
      ASSETBOOK_AI_BASE: ${ASSETBOOK_AI_BASE:-}
      ASSETBOOK_AI_KEY: ${ASSETBOOK_AI_KEY:-}
      ASSETBOOK_AI_MODEL: ${ASSETBOOK_AI_MODEL:-}
      # 自动同步：定时刷新持仓现价、汇率、记净值快照（详见 .env.example）
      ASSETBOOK_AUTO_SYNC: ${ASSETBOOK_AUTO_SYNC:-1}
      ASSETBOOK_QUOTE_INTERVAL_MIN: ${ASSETBOOK_QUOTE_INTERVAL_MIN:-30}
      ASSETBOOK_SNAPSHOT_HOUR: ${ASSETBOOK_SNAPSHOT_HOUR:-23}
      ASSETBOOK_RATES_INTERVAL_HOUR: ${ASSETBOOK_RATES_INTERVAL_HOUR:-12}
      # 账单自动收取：收件目录 + IMAP 邮箱（详见 .env.example）
      ASSETBOOK_INBOX: ${ASSETBOOK_INBOX:-}
      ASSETBOOK_INBOX_ACCOUNT: ${ASSETBOOK_INBOX_ACCOUNT:-}
      ASSETBOOK_INBOX_INTERVAL_MIN: ${ASSETBOOK_INBOX_INTERVAL_MIN:-10}
      ASSETBOOK_IMAP_HOST: ${ASSETBOOK_IMAP_HOST:-}
      ASSETBOOK_IMAP_PORT: ${ASSETBOOK_IMAP_PORT:-993}
      ASSETBOOK_IMAP_USER: ${ASSETBOOK_IMAP_USER:-}
      ASSETBOOK_IMAP_PASS: ${ASSETBOOK_IMAP_PASS:-}
      ASSETBOOK_IMAP_FOLDER: ${ASSETBOOK_IMAP_FOLDER:-INBOX}
      ASSETBOOK_IMAP_SSL: ${ASSETBOOK_IMAP_SSL:-1}
      ASSETBOOK_IMAP_FROM: ${ASSETBOOK_IMAP_FROM:-}
      ASSETBOOK_WECHAT_ZIP_PASSWORD: ${ASSETBOOK_WECHAT_ZIP_PASSWORD:-}
      ASSETBOOK_MAIL_INTERVAL_MIN: ${ASSETBOOK_MAIL_INTERVAL_MIN:-60}
      TZ: Asia/Shanghai
    volumes:
      # 账本数据（assetbook.db）就存在这个具名卷里，容器删了也不会丢
      - assetbook-data:/data

volumes:
  assetbook-data:
